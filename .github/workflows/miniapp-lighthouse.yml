name: MiniApp Lighthouse CI

on:
  pull_request:
    paths:
      - 'miniapp/**'
  push:
    branches: [ main ]
    paths:
      - 'miniapp/**'

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install root release tooling
        run: npm ci

      - name: Install miniapp dependencies
        run: npm ci --prefix miniapp

      - name: Build miniapp
        run: npm run build --prefix miniapp

      - name: Install http-server and LHCI
        run: npm exec --no -- http-server --version && npm exec --no -- lhci --version

      - name: Serve miniapp (background)
        run: npm exec --no -- http-server miniapp/dist -p 4173 &

      - name: Run LHCI autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: npm exec --no -- lhci autorun --config=.lighthouserc.json

      - name: Archive LHCI artifacts (if produced)
        if: always()
        run: |
          mkdir -p lhci-reports
          test -d ./.lighthouseci
          cp -r ./.lighthouseci/* lhci-reports/
          test -n "$(find lhci-reports -type f -print -quit)"

      - name: Upload LHCI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miniapp-lhci-reports
          path: lhci-reports

      - name: Upload LHCI report (temporary public URL)
        if: always()
        run: echo "LHCI autorun completed (check artifacts for LHCI reports if available)"
